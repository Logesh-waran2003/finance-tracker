name: CI

on:
  push:
  pull_request:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dummy values only. The build must never need a live database.
    # They exist because lib/env.ts fails fast when they are missing — that
    # check is correct and protects production.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/finance_tracker_ci
      NEXTAUTH_SECRET: ci-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
